'use strict';
const DATA={"lessons": [{"level": "A1", "type": "Nahiv", "title": "Kelime türleri", "body": "Arapçada kelimeler isim, fiil ve harf olmak üzere üç ana gruptur. İsim zaman bildirmez; fiil bir oluşu veya işi zamanla ilişkilendirir; harf başka kelimelerle birlikte anlam kurar.", "ar": "كِتَابٌ — كَتَبَ — فِي", "tr": "Kitap — yazdı — içinde"}, {"level": "A1", "type": "Nahiv", "title": "İşaret isimleri", "body": "هَذَا eril tekil; هَذِهِ dişil tekil isimlerle kullanılır. İşaret edilen varlığın dilbilgisel cinsiyetine dikkat edilir.", "ar": "هَذَا قَلَمٌ. هَذِهِ مَدْرَسَةٌ.", "tr": "Bu bir kalemdir. Bu bir okuldur."}, {"level": "A1", "type": "Nahiv", "title": "Mübteda ve haber", "body": "İsim cümlesinde mübteda hakkında bilgi verilen unsur, haber ise bu bilgiyi tamamlayan unsurdur. Basit olumlu cümlelerde ikisi de genellikle merfûdur.", "ar": "الطَّالِبُ مُجْتَهِدٌ.", "tr": "Öğrenci çalışkandır."}, {"level": "A1", "type": "Nahiv", "title": "Marife ve nekre", "body": "ال takısı birçok isimde belirlilik bildirir. Tenvinli isimler çoğu zaman nekredir; ancak belirlilik yalnızca ال ile sağlanmaz.", "ar": "كِتَابٌ — الْكِتَابُ", "tr": "Bir kitap — kitap (belirli)"}, {"level": "A1", "type": "Nahiv", "title": "Müzekker ve müennes", "body": "Arapça isimlerde dilbilgisel eril ve dişil ayrımı vardır. ة sık görülen dişillik işaretidir, ancak tek ölçüt değildir.", "ar": "مُعَلِّمٌ — مُعَلِّمَةٌ", "tr": "Erkek öğretmen — kadın öğretmen"}, {"level": "A1", "type": "Sarf", "title": "Mâzî fiil", "body": "Mâzî fiil temel olarak tamamlanmış/geçmiş bir eylemi anlatır. Kişi ve sayıya göre çekimlenir.", "ar": "كَتَبَ الطَّالِبُ الدَّرْسَ.", "tr": "Öğrenci dersi yazdı."}, {"level": "A1", "type": "Sarf", "title": "Muzâri fiil", "body": "Muzâri fiil bağlama göre şimdiki veya geniş zaman anlamı verir. يَكْتُبُ üçüncü tekil eril şahıstır.", "ar": "يَكْتُبُ الطَّالِبُ.", "tr": "Öğrenci yazıyor / yazar."}, {"level": "A1", "type": "Nahiv", "title": "Harf-i cer", "body": "فِي, مِنْ, إِلَى gibi harf-i cerler sonrasındaki ismi mecrur yapar.", "ar": "الْقَلَمُ فِي الْحَقِيبَةِ.", "tr": "Kalem çantadadır."}, {"level": "A1", "type": "Nahiv", "title": "Şahıs zamirleri", "body": "أَنَا birinci tekil, أَنْتَ ikinci tekil eril, أَنْتِ ikinci tekil dişil, هُوَ üçüncü tekil eril, هِيَ üçüncü tekil dişildir.", "ar": "أَنَا طَالِبٌ. هِيَ طَالِبَةٌ.", "tr": "Ben öğrenciyim. O (kadın) öğrencidir."}, {"level": "A1", "type": "Nahiv", "title": "Soru edatları", "body": "مَا “ne”, مَنْ “kim”, أَيْنَ “nerede”, هَلْ ise evet/hayır sorusu oluşturur.", "ar": "أَيْنَ الْكِتَابُ؟", "tr": "Kitap nerede?"}, {"level": "A2", "type": "Nahiv", "title": "İsim tamlaması (izafet)", "body": "Muzâf ile muzâfun ileyh bir isim tamlaması oluşturur. Muzâfun ileyh mecrur olur; muzâf normalde tenvin almaz.", "ar": "كِتَابُ الطَّالِبِ جَدِيدٌ.", "tr": "Öğrencinin kitabı yenidir."}, {"level": "A2", "type": "Nahiv", "title": "Sıfat ve mevsuf", "body": "Sıfat genellikle nitelediği isimden sonra gelir; belirlik, cinsiyet, sayı ve i‘rab bakımından onunla uyum gösterir.", "ar": "قَرَأْتُ كِتَابًا مُفِيدًا.", "tr": "Faydalı bir kitap okudum."}, {"level": "A2", "type": "Sarf", "title": "Emir fiili", "body": "Emir, doğrudan hitap edilen kişiden bir eylem yapmasını istemek için kullanılır. كَتَبَ fiilinin eril tekil emri اُكْتُبْ şeklindedir.", "ar": "اُكْتُبْ دَرْسَكَ.", "tr": "Dersini yaz."}, {"level": "A2", "type": "Nahiv", "title": "Mef‘ûl bih", "body": "Geçişli fiilin etkilediği nesne mef‘ûl bih olur ve temel durumda mansubdur.", "ar": "قَرَأَتِ الْبِنْتُ الْكِتَابَ.", "tr": "Kız kitabı okudu."}, {"level": "A2", "type": "Nahiv", "title": "Kâne ve benzerleri", "body": "كَانَ isim cümlesine girdiğinde ismini merfû, haberini mansub yapar. Zaman ve bağlama göre farklı anlamlar kazanabilir.", "ar": "كَانَ الْجَوُّ جَمِيلًا.", "tr": "Hava güzeldi."}, {"level": "A2", "type": "Nahiv", "title": "İnne ve benzerleri", "body": "إِنَّ isim cümlesinin başına geldiğinde ismini mansub, haberini merfû yapar; çoğunlukla pekiştirme bildirir.", "ar": "إِنَّ الْعِلْمَ نَافِعٌ.", "tr": "Şüphesiz ilim faydalıdır."}, {"level": "A2", "type": "Sarf", "title": "Olumsuzluk: لم", "body": "لَمْ muzâri fiili cezmeder ve geçmişe yönelik olumsuzluk bildirir.", "ar": "لَمْ يَذْهَبْ أَحْمَدُ.", "tr": "Ahmed gitmedi."}, {"level": "A2", "type": "Sarf", "title": "Gelecek zaman", "body": "سَـ veya سَوْفَ muzâri fiille birlikte geleceğe yönelme bildirir.", "ar": "سَأَقْرَأُ غَدًا.", "tr": "Yarın okuyacağım."}, {"level": "A2", "type": "Nahiv", "title": "Zaman ve mekân zarfları", "body": "ظَرْفُ الزَّمَانِ eylemin zamanını, ظَرْفُ الْمَكَانِ yerini gösterir.", "ar": "جَلَسْتُ أَمَامَ الْبَيْتِ.", "tr": "Evin önünde oturdum."}, {"level": "A2", "type": "Nahiv", "title": "İsim ve fiil cümlesi karşılaştırması", "body": "İsim cümlesi çoğunlukla isimle, fiil cümlesi ise fiille başlar. Cümle kuruluşu bilgi odağını etkileyebilir.", "ar": "الطَّالِبُ يَكْتُبُ. / يَكْتُبُ الطَّالِبُ.", "tr": "Öğrenci yazıyor. / Öğrenci yazıyor."}, {"level": "B1", "type": "Nahiv", "title": "Şart cümlesi", "body": "إِنْ gibi şart edatları şart ve cevap ilişkisi kurar. Cezmeden şart edatları uygun muzâri fiilleri cezmeder.", "ar": "إِنْ تَدْرُسْ تَنْجَحْ.", "tr": "Çalışırsan başarılı olursun."}, {"level": "B1", "type": "Nahiv", "title": "İsm-i mevsûl", "body": "الَّذِي, الَّتِي gibi ism-i mevsûller ardından gelen sıla cümlesiyle belirli bir ismi niteler.", "ar": "جَاءَ الطَّالِبُ الَّذِي نَجَحَ.", "tr": "Başarılı olan öğrenci geldi."}, {"level": "B1", "type": "Sarf", "title": "İsm-i fâil", "body": "Üç harfli yalın fiillerde ism-i fâil çoğunlukla فَاعِلٌ kalıbında yapılır ve işi yapanı belirtir.", "ar": "كَتَبَ — كَاتِبٌ", "tr": "Yazdı — yazan / yazar"}, {"level": "B1", "type": "Sarf", "title": "İsm-i mef‘ûl", "body": "Üç harfli yalın fiillerde ism-i mef‘ûl çoğunlukla مَفْعُولٌ kalıbında yapılır ve eylemden etkileneni anlatır.", "ar": "كَتَبَ — مَكْتُوبٌ", "tr": "Yazdı — yazılmış"}, {"level": "B1", "type": "Nahiv", "title": "Hâl", "body": "Hâl, function word(){const ws=filtered('words'),w=ws[wordIndex%ws.length],idx=DATA.words.indexOf(w);if(!state.seen.includes(idx)){state.seen.push(idx);save()}mark('words',idx);shell(level+' kelime kartları','Harekeli kelimeler ve örnek cümleler',`<div class="panel word-card"><span class="tag">${wordIndex%ws.length+1} / ${ws.length}</span><div class="arabic">${esc(w.ar)}</div><h2 class="center">${esc(w.tr)}</h2><hr class="divider"><div class="arabic-small">${esc(w.ex)}</div><p>${esc(w.meaning)}</p><div class="navrow"><button class="secondary" onclick="wordIndex=(wordIndex+${ws.length}-1)%${ws.length};word()">← Önceki</button><button class="primary" onclick="wordIndex++;word()">Sonraki →</button></div></div>`)}
function grammar(){const ls=filtered('lessons');shell(level+' Nahiv ve Sarf','Ders seçip tamamlayabilirsin',`<div class="panel"><h2>${level} dersleri</h2>${ls.map((l,i)=>`<button class="lesson-btn" onclick="lessonIndex=${DATA.lessons.indexOf(l)};go('lesson')"><span class="tag">${esc(l.type)}</span> ${state.completed.includes(DATA.lessons.indexOf(l))?'✓ ':''}${i+1}. ${esc(l.title)} →</button>`).join('')}</div>`)}
function lesson(){state.lastLesson=lessonIndex;save();const l=DATA.lessons[lessonIndex];shell(esc(l.title),l.level+' • '+l.type,`<div class="panel"><span class="tag">${esc(l.level)} · ${esc(l.type)}</span><p>${esc(l.body)}</p><div class="arabic-small">${esc(l.ar)}</div><p><strong>Türkçesi:</strong> ${esc(l.tr)}</p><button class="primary" onclick="completeLesson()">${state.completed.includes(lessonIndex)?'✓ Tamamlandı — Ders listesine dön':'Dersi tamamladım ✓'}</button></div>`)}
function completeLesson(){if(!state.completed.includes(lessonIndex)){state.completed.push(lessonIndex);mark('lessons',lessonIndex);save()}go('grammar')}
function modern(){const cs=filtered('modern'),c=cs[modernIndex%cs.length];shell(level+' Modern Arapça','Günlük ifadeler',`<div class="panel"><span class="tag">${modernIndex%cs.length+1}/${cs.length}</span><h2>${esc(c.title)}</h2><div class="arabic">${esc(c.ar)}</div><h3 class="center">${esc(c.tr)}</h3><button class="primary" onclick="modernIndex++;modern()">Sonraki ifade →</button></div>`)}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function quiz(){locked=false;const ws=filtered('words'),w=ws[quizIndex%ws.length];const opts=shuffle([w,...shuffle(DATA.words.filter(x=>x.tr!==w.tr)).slice(0,3)]);shell(level+' kelime testi','Dört seçenekli sorular',`<div class="panel"><span class="tag">Soru ${quizIndex%ws.length+1}/${ws.length}</span><p>Bu kelimenin Türkçesi nedir?</p><div class="arabic">${esc(w.ar)}</div><div id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><button class="primary hidden" id="nextBtn" onclick="quizIndex++;quiz()">Sonraki soru →</button></div>`);opts.forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o.tr;b.onclick=()=>{if(locked)return;locked=true;const ok=o.tr===w.tr;state.quizTotal++;if(ok){state.quizCorrect++;state.wrongWords=state.wrongWords.filter(i=>i!==DATA.words.indexOf(w))}else if(!state.wrongWords.includes(DATA.words.indexOf(w)))state.wrongWords.push(DATA.words.indexOf(w));mark('quiz');save();[...$('choices').children].forEach(x=>{x.disabled=true;if(x.textContent===w.tr)x.classList.add('correct')});if(!ok)b.classList.add('wrong');$('feedback').textContent=ok?'✓ Doğru!':'Doğru cevap: '+w.tr;$('nextBtn').classList.remove('hidden')};$('choices').appendChild(b)})}
function translation(){locked=false;const ts=filtered('translations'),t=ts[transIndex%ts.length];let pool=DATA.translations.filter(x=>x.tr!==t.tr).map(x=>x.tr),options=shuffle([t.tr,...shuffle(pool).slice(0,3)]);shell(level+' çeviri','Arapçadan Türkçeye alıştırma',`<div class="panel"><span class="tag">Alıştırma ${transIndex%ts.length+1}/${ts.length}</span><p>Doğru çeviriyi seç:</p><div class="arabic">${esc(t.ar)}</div><div id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><p class="muted hidden" id="explanation"></p><button class="primary hidden" id="nextBtn" onclick="transIndex++;translation()">Sonraki çeviri →</button></div>`);options.forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>{if(locked)return;locked=true;const ok=o===t.tr;state.transTotal++;if(ok){state.transCorrect++;state.wrongTranslations=state.wrongTranslations.filter(i=>i!==DATA.translations.indexOf(t))}else if(!state.wrongTranslations.includes(DATA.translations.indexOf(t)))state.wrongTranslations.push(DATA.translations.indexOf(t));mark('translation');save();[...$('choices').children].forEach(x=>{x.disabled=true;if(x.textContent===t.tr)x.classList.add('correct')});if(!ok)b.classList.add('wrong');$('feedback').textContent=ok?'✓ Doğru çeviri!':'Doğru cevap: '+t.tr;$('explanation').textContent='Açıklama: '+t.why;$('explanation').classList.remove('hidden');$('nextBtn').classList.remove('hidden')};$('choices').appendChild(b)})}

function dashboard(){const total=state.completed.length,words=state.seen.length,correct=state.quizCorrect+state.transCorrect,all=state.quizTotal+state.transTotal;const badges=[['🌱 İlk adım',words>=1],['📚 5 ders bitirdin',total>=5],['🧠 20 kelime gördün',words>=20],['🎯 10 doğru cevap',correct>=10],['🔥 3 gün üst üste',streak()>=3],['🏆 20 ders bitirdin',total>=20]];shell('İlerlemen','Günlük hedefler, başarılar ve istatistikler',`<div class="panel"><h2>📊 Genel istatistikler</h2><div class="statgrid"><div class="statbox"><b>${words}/${DATA.words.length}</b>Görülen kelime</div><div class="statbox"><b>${total}/${DATA.lessons.length}</b>Tamamlanan ders</div><div class="statbox"><b>${all?Math.round(correct/all*100):0}%</b>Doğru yanıt oranı</div><div class="statbox"><b>${streak()} gün</b>Çalışma serisi</div></div><p class="muted">Bugün ${daily().words.length} farklı kelime gördün, ${daily().lessons.length} ders tamamladın. Günlük hedef: 10 kelime ve 1 ders.</p></div><div class="panel"><h2>🏅 Başarı rozetleri</h2>${badges.map(([t,ok])=>`<div class="badge-item ${ok?'':'off'}">${ok?'✓':'🔒'} ${t}</div>`).join('')}</div><div class="panel"><h3>Yanlış cevaplar</h3><p>${state.wrongWords.length} kelime · ${state.wrongTranslations.length} çeviri</p><button class="primary" onclick="go('review')">Yanlışları tekrar et</button></div>`)}
let reviewItems=[],reviewIndex=0;
function review(){reviewItems=[...state.wrongWords.map(i=>({type:'word',id:i,ar:DATA.words[i].ar,tr:DATA.words[i].tr,why:DATA.words[i].meaning})),...state.wrongTranslations.map(i=>({type:'translation',id:i,ar:DATA.translations[i].ar,tr:DATA.translations[i].tr,why:DATA.translations[i].why}))];reviewIndex=0;renderReview()}
function renderReview(){locked=false;if(!reviewItems.length){shell('Yanlışları tekrar et','Tekrar kuyruğu',`<div class="panel"><h2>🎉 Harika!</h2><p>Şu an tekrar edilecek yanlış cevap bulunmuyor.</p><button class="primary" onclick="go('home')">Ana sayfa</button></div>`);return}if(reviewIndex>=reviewItems.length){shell('Tekrar tamamlandı','Çalışmaya devam!',`<div class="panel"><p>Bu turu tamamladın. Düzelttiğin cevaplar tekrar listesinden çıkarıldı.</p><button class="primary" onclick="go('home')">Ana sayfa</button></div>`);return}const x=reviewItems[reviewIndex];const pool=x.type==='word'?DATA.words:DATA.translations;const options=shuffle([x.tr,...shuffle(pool.filter(z=>z.tr!==x.tr).map(z=>z.tr)).slice(0,3)]);shell('🔁 Yanlışları tekrar et',`${reviewIndex+1}/${reviewItems.length} · ${x.type==='word'?'Kelime':'Çeviri'}`,`<div class="panel"><p>Doğru Türkçe karşılığı seç:</p><div class="arabic">${esc(x.ar)}</div><div id="choices"></div><p id="feedback" class="feedback" aria-live="polite"></p><p id="explanation" class="muted hidden"></p><button id="nextBtn" class="primary hidden" onclick="reviewIndex++;renderReview()">Sonraki →</button></div>`);options.forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>{if(locked)return;locked=true;const ok=o===x.tr;const key=x.type==='word'?'wrongWords':'wrongTranslations';if(ok)state[key]=state[key].filter(i=>i!==x.id);save();[...$('choices').children].forEach(el=>{el.disabled=true;if(el.textContent===x.tr)el.classList.add('correct')});if(!ok)b.classList.add('wrong');$('feedback').textContent=ok?'✓ Doğru! Tekrar listesinden çıkarıldı.':'Doğru cevap: '+x.tr;$('explanation').textContent=x.why;$('explanation').classList.remove('hidden');$('nextBtn').classList.remove('hidden')};$('choices').appendChild(b)})}

render();</script></body></html>
